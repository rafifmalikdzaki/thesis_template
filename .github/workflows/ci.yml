name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PDF and Overleaf package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live, Poppler and archiving tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-other \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-science \
            unzip \
            zip

      - name: Build main.pdf with latexmk (pdfLaTeX default)
        run: bash build.sh

      - name: Check that the build produced a PDF and a clean log
        run: |
          test -s main.pdf
          pdfinfo main.pdf | grep -q '^Pages:'
          if grep -q '^!' build/main.log; then
            echo 'LaTeX errors found:'
            grep -n '^!' build/main.log
            exit 1
          fi
          if grep -qi 'undefined' build/main.log; then
            echo 'Undefined references found:'
            grep -in 'undefined' build/main.log
            exit 1
          fi

      - name: Package the Overleaf archive and verify the extracted build
        run: bash scripts/package_overleaf.sh

      - name: Upload main.pdf
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: error

      - name: Upload Overleaf package
        uses: actions/upload-artifact@v4
        with:
          name: overleaf-package
          path: dist/thesis_template_overleaf.zip
          if-no-files-found: error

  compat:
    name: Engine compatibility (${{ matrix.engine }}) [advisory]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory, and only on main/master pushes or a manual run. Pull requests
    # run just the required pdfLaTeX build, so a first-time contributor never
    # needs the extra TeX installs and a platform-side font problem cannot
    # block anyone.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    # pdfLaTeX is the required reference engine (see the `build` job). The
    # other engines are a convenience: a platform-side failure (missing font
    # package, old luaotfload, runner image change) must not fail the
    # workflow. At least one engine - the required one - has to work.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        engine: [xelatex, lualatex]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live for ${{ matrix.engine }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-other \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-luatex \
            texlive-science \
            texlive-xetex \
            unzip \
            zip

      - name: Build main.pdf with ${{ matrix.engine }}
        run: bash build.sh --engine=${{ matrix.engine }}

      - name: Require a PDF of at least 30 pages
        run: |
          test -s main.pdf
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          echo "${{ matrix.engine }} built $pages pages"
          test "${pages:-0}" -ge 30

      - name: Record advisory result
        if: always()
        run: |
          if [ -s main.pdf ]; then
            pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
            echo "| ${{ matrix.engine }} | built ${pages} pages | advisory |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ${{ matrix.engine }} | did not produce a PDF | advisory, non-blocking |" >> "$GITHUB_STEP_SUMMARY"
          fi
